appId: com.sakuya.skillvault
productName: SkillVault
directories:
  output: dist
files:
  - out/**
  - package.json
win:
  # Windows 目标需要 .ico（由 build/icon.png 经 Pillow 生成，多尺寸 16-256）
  icon: build/icon.ico
  target:
    # portable：免安装单文件（每次启动重新解压，启动偏慢但零安装）
    - target: portable
      arch:
        - x64
    # nsis：一次性安装到本机，启动不再重复解压 ~250MB（修复启动慢的另一半）
    - target: nsis
      arch:
        - x64
  # 无签名证书，不做签名；rcedit 资源改写保持默认开启，把 build/icon.png 嵌入 exe 资源
nsis:
  oneClick: true
  perMachine: false
